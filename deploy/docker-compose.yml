# Synology Container Manager project for the infosecfollow runner.
# Builds from a LOCAL context (this folder), so the Docker daemon needs no git.
# Fetch the build files (Dockerfile, run-briefing.sh, scheduler.sh, this file)
# into this folder with curl first — see README — then `docker compose up -d
# --build`. The container clones the app into a named volume itself (its own
# bundled git).
services:
  infosecfollow:
    build: .
    image: infosecfollow-runner
    container_name: infosecfollow
    restart: unless-stopped
    # Run the scheduler under a minimal init so SIGTERM reaches it promptly,
    # and give an in-flight briefing time to finish before a stop kills it:
    # the longest possible run is GENERATE_TIMEOUT + 2*GIT_TIMEOUT in
    # run-briefing.sh (1500 + 240 s), so 30 minutes covers it. A normal run
    # takes about four minutes, and `docker stop` returns as soon as the
    # scheduler exits, so the grace period only matters for a degraded run.
    init: true
    stop_grace_period: 30m
    env_file:
      - .env
    environment:
      # Drives both the schedule and the date stamps in the site.
      TZ: America/New_York
    volumes:
      - infosecfollow-data:/data/infosecfollow
    # Cap container logs at 3 x 10MB so they can't grow without bound.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  infosecfollow-data:
