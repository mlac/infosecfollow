name: Redeploy to GitHub Pages (manual)

# MANUAL fallback only. The site is normally published by GitHub's built-in
# "pages build and deployment" pipeline (Settings -> Pages -> Source: Deploy
# from a branch, main:/docs), which runs on every push to main. This workflow
# exists for the day that pipeline is stuck or fails: trigger it from the
# Actions tab and it re-uploads docs/ from main with three deploy attempts and
# backoff. It has no push trigger, so the two pipelines never race.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url || steps.try2.outputs.page_url || steps.try1.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.try1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final attempt
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (final attempt)
        id: final
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
