name: Redeploy to GitHub Pages (manual)

# MANUAL fallback only. The site is normally published by GitHub's built-in
# "pages build and deployment" pipeline (Settings -> Pages -> Source: Deploy
# from a branch, main:/docs), which runs on every push to main. This workflow
# exists for the day that pipeline is stuck or fails: trigger it from the
# Actions tab WITH "main" SELECTED in the "Use workflow from" dropdown (a
# branch-source Pages site only accepts deployments from runs on main) and it
# re-uploads docs/ from main with three deploy attempts and backoff. It has no
# push trigger, so the two pipelines never race.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main (Use workflow from: main); Pages only accepts deployments from main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Each deploy-pages attempt may poll for up to 10 minutes when the Pages
    # backend is stuck; three attempts plus the two sleeps need about 33.
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url || steps.try2.outputs.page_url || steps.try1.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.try1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final attempt
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (final attempt)
        id: final
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
